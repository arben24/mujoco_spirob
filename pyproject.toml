[project]
name = "mujoco-spirob"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.7",
    "mujoco>=3.3.7",
    "myst-parser>=4.0.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pathlib>=1.0.1",
    "polars>=1.35.2",
    "pyarrow>=15.0.0",
    "pydantic>=2.0",
    "seaborn>=0.13.0",
    "pyqt5>=5.15.11; sys_platform == 'linux'",
    "pyqt6>=6.10.0; sys_platform == 'linux'",
    "pyqtgraph>=0.14.0; sys_platform == 'linux'",
    "pyside6>=6.10.1; sys_platform == 'linux'",
    "pytest>=9.0.0",
    "ruff>=0.14.5",
    "scipy>=1.15.3",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.0.2",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "tests",
]


